- id: "gta-vla"
  title: "Guide, Think, Act: Interactive Embodied Reasoning in Vision-Language-Action Models"
  authors: "<strong>Yiran Ling</strong><sup>*</sup>, Qing Lian<sup>*</sup>, Jinghang Li, Qing Jiang, Tianming Zhang, Xiaoke Jiang, Chuanxiu Liu, Jie Liu, and Lei Zhang"
  note: "* Equal contribution"
  venue: "European Conference on Computer Vision (ECCV), 2026"
  badge: "ECCV 2026"
  summary: "GTA-VLA introduces spatially steerable embodied reasoning: a user can provide an affordance point, box, or trace to resolve ambiguity and guide a robot policy toward accurate execution. The method reaches an 81.2% success rate on the SimplerEnv WidowX benchmark and improves robustness under out-of-domain visual shifts."
  image: "/images/publications/gta-vla-overview.png"
  image_alt: "GTA-VLA uses spatial guidance to resolve ambiguous robot manipulation tasks"
  detail_url: "/publication/gta-vla/"
  paper_url: "https://arxiv.org/abs/2605.13632"
  project_url: "https://signalispupupu.github.io/GTA-VLA_ProjPage/"
  code_url: "https://github.com/FutianLabs/GTA-VLA"

- id: "cofie"
  title: "CoFiE: Coarse-to-Fine Evidence Selection for Efficient Streaming Video Understanding"
  authors: "Jing Jiang<sup>*</sup>, <strong>Yiran Ling</strong><sup>*</sup>, Ruonan Li, Dimitrios Stamoulis<sup>†</sup>, and Jie Liu<sup>†</sup>"
  note: "* Equal contribution · † Corresponding authors"
  venue: "Conference on Empirical Methods in Natural Language Processing (EMNLP), 2026"
  badge: "EMNLP 2026"
  summary: "CoFiE accelerates streaming video understanding through coarse-to-fine evidence selection. It removes redundant frames before visual encoding, then refines query-relevant evidence during multimodal prefill, reaching state-of-the-art accuracy-efficiency trade-offs with up to 2.54× lower end-to-end inference latency."
  image: "/images/publications/cofie-overview.png"
  image_alt: "CoFiE retains semantically relevant frames for efficient streaming video understanding"
  detail_url: "/publication/cofie/"
